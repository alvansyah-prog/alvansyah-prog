name: Profile contribution art

# Regenerates the animated snake and the 3D contribution graph shown in README.md
on:
  schedule:
    - cron: "17 0 * * *" # every day, 07:17 WIB
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/profile-art.yml"]

permissions:
  contents: write

concurrency:
  group: profile-art
  cancel-in-progress: false

jobs:
  snake:
    runs-on: ubuntu-latest
    steps:
      - name: Generate snake (midnight + lime)
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-dark.svg?color_snake=#c6ff3d&color_dots=#161b22,#24340f,#3f6212,#7fb51f,#c6ff3d
            dist/snake-light.svg?color_snake=#4d7c0f&color_dots=#eceff4,#d9f99d,#a3e635,#65a30d,#3f6212

      - name: Publish to the "output" branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  contrib-3d:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate 3D contribution graph
        uses: yoshi389111/github-profile-3d-contrib@v0.9.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}

      - name: Commit images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A profile-3d-contrib
          if git commit -m "chore: update 3D contribution graph"; then
            git pull --rebase origin main
            git push
          fi

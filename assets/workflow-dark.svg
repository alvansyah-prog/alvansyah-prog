<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 250" width="1200" height="250" role="img" aria-label="Workflow: Plan, Code, Commit, Build and Test, Deploy, Live">
<style>
  .sans { font-family: 'Space Grotesk','Segoe UI',Ubuntu,Helvetica,Arial,sans-serif; }
  .mono { font-family: 'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; }
  .node { animation: lit 10.0s linear infinite; }
  @keyframes lit { 0% { stroke: #c6ff3d; filter: drop-shadow(0 0 8px #c6ff3d); } 9% { stroke: #c6ff3d; filter: drop-shadow(0 0 8px #c6ff3d); } 16%, 100% { stroke: #1e222c; filter: none; } }
  .move { animation: move 10.0s cubic-bezier(.65,0,.35,1) infinite; }
  @keyframes move { 0.00% { transform: translateX(0px); } 9.17% { transform: translateX(0px); } 16.67% { transform: translateX(192px); } 25.83% { transform: translateX(192px); } 33.33% { transform: translateX(384px); } 42.50% { transform: translateX(384px); } 50.00% { transform: translateX(576px); } 59.17% { transform: translateX(576px); } 66.67% { transform: translateX(768px); } 75.83% { transform: translateX(768px); } 83.33% { transform: translateX(960px); } 92.50% { transform: translateX(960px); } 100% { transform: translateX(960px); } }
  .prog { transform-box: fill-box; transform-origin: left; animation: prog 10.0s cubic-bezier(.65,0,.35,1) infinite; }
  @keyframes prog { 0.00% { transform: scaleX(0.0000); } 9.17% { transform: scaleX(0.0000); } 16.67% { transform: scaleX(0.2000); } 25.83% { transform: scaleX(0.2000); } 33.33% { transform: scaleX(0.4000); } 42.50% { transform: scaleX(0.4000); } 50.00% { transform: scaleX(0.6000); } 59.17% { transform: scaleX(0.6000); } 66.67% { transform: scaleX(0.8000); } 75.83% { transform: scaleX(0.8000); } 83.33% { transform: scaleX(1.0000); } 92.50% { transform: scaleX(1.0000); } 100% { transform: scaleX(1); } }
  @media (prefers-reduced-motion: reduce) { .node, .move, .prog { animation: none; } }
</style>
<rect width="1200" height="250" rx="18" fill="#07080c" stroke="#1e222c"/>
<path d="M120 104 H1080" stroke="#1e222c" stroke-width="2" stroke-dasharray="6 8"/>
<rect x="120" y="103" width="960" height="2.5" fill="#c6ff3d" class="prog"/>

  <g>
    <circle cx="120" cy="104" r="34" fill="#0e1016" stroke="#1e222c" stroke-width="1.5" class="node" style="animation-delay:0.00s"/>
    <text x="120" y="110" text-anchor="middle" class="mono" font-size="17" font-weight="700" fill="#c6ff3d">≡</text>
    <text x="120" y="170" text-anchor="middle" class="sans" font-size="18" font-weight="600" fill="#e8ecf4">Plan</text>
    <text x="120" y="192" text-anchor="middle" class="mono" font-size="11.5" fill="#646d80">wireframe · architecture</text>
    <text x="120" y="58" text-anchor="middle" class="mono" font-size="11" fill="#646d80">01</text>
  </g>
  <g>
    <circle cx="312" cy="104" r="34" fill="#0e1016" stroke="#1e222c" stroke-width="1.5" class="node" style="animation-delay:1.67s"/>
    <text x="312" y="110" text-anchor="middle" class="mono" font-size="17" font-weight="700" fill="#c6ff3d">&lt;/&gt;</text>
    <text x="312" y="170" text-anchor="middle" class="sans" font-size="18" font-weight="600" fill="#e8ecf4">Code</text>
    <text x="312" y="192" text-anchor="middle" class="mono" font-size="11.5" fill="#646d80">api · ui · database</text>
    <text x="312" y="58" text-anchor="middle" class="mono" font-size="11" fill="#646d80">02</text>
  </g>
  <g>
    <circle cx="504" cy="104" r="34" fill="#0e1016" stroke="#1e222c" stroke-width="1.5" class="node" style="animation-delay:3.33s"/>
    <text x="504" y="110" text-anchor="middle" class="mono" font-size="17" font-weight="700" fill="#c6ff3d">-o-</text>
    <text x="504" y="170" text-anchor="middle" class="sans" font-size="18" font-weight="600" fill="#e8ecf4">Commit</text>
    <text x="504" y="192" text-anchor="middle" class="mono" font-size="11.5" fill="#646d80">branch · review · merge</text>
    <text x="504" y="58" text-anchor="middle" class="mono" font-size="11" fill="#646d80">03</text>
  </g>
  <g>
    <circle cx="696" cy="104" r="34" fill="#0e1016" stroke="#1e222c" stroke-width="1.5" class="node" style="animation-delay:5.00s"/>
    <text x="696" y="110" text-anchor="middle" class="mono" font-size="17" font-weight="700" fill="#c6ff3d">✓</text>
    <text x="696" y="170" text-anchor="middle" class="sans" font-size="18" font-weight="600" fill="#e8ecf4">Build &amp; Test</text>
    <text x="696" y="192" text-anchor="middle" class="mono" font-size="11.5" fill="#646d80">lint · tests · ci</text>
    <text x="696" y="58" text-anchor="middle" class="mono" font-size="11" fill="#646d80">04</text>
  </g>
  <g>
    <circle cx="888" cy="104" r="34" fill="#0e1016" stroke="#1e222c" stroke-width="1.5" class="node" style="animation-delay:6.67s"/>
    <text x="888" y="110" text-anchor="middle" class="mono" font-size="17" font-weight="700" fill="#c6ff3d">↑</text>
    <text x="888" y="170" text-anchor="middle" class="sans" font-size="18" font-weight="600" fill="#e8ecf4">Deploy</text>
    <text x="888" y="192" text-anchor="middle" class="mono" font-size="11.5" fill="#646d80">cloud · edge · zero-downtime</text>
    <text x="888" y="58" text-anchor="middle" class="mono" font-size="11" fill="#646d80">05</text>
  </g>
  <g>
    <circle cx="1080" cy="104" r="34" fill="#0e1016" stroke="#1e222c" stroke-width="1.5" class="node" style="animation-delay:8.33s"/>
    <text x="1080" y="110" text-anchor="middle" class="mono" font-size="17" font-weight="700" fill="#c6ff3d">◉</text>
    <text x="1080" y="170" text-anchor="middle" class="sans" font-size="18" font-weight="600" fill="#e8ecf4">Live</text>
    <text x="1080" y="192" text-anchor="middle" class="mono" font-size="11.5" fill="#646d80">monitor · iterate</text>
    <text x="1080" y="58" text-anchor="middle" class="mono" font-size="11" fill="#646d80">06</text>
  </g>
<g class="move">
  <g transform="translate(120 42)">
    <rect x="-24" y="-14" width="48" height="26" rx="7" fill="#c6ff3d"/>
    <text x="0" y="4" text-anchor="middle" class="mono" font-size="12" font-weight="700" fill="#07080c">&lt;/&gt;</text>
    <path d="M-5 12 L0 18 L5 12 Z" fill="#c6ff3d"/>
  </g>
</g>
</svg>
